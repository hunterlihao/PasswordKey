[package]
name = "password-manager"
version = "2.0.0"
edition = "2021"
rust-version = "1.77"
description = "本地离线密码管理器（Rust 便携版）"
authors = ["liyuanhao"]
license = "MIT"

[[bin]]
name = "PasswordManager"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
calamine = "0.30.1"
chrono = "0.4.45"
getrandom = "0.3"
png = "0.17"
raw-window-handle = "0.6"
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust_xlsxwriter = "0.92.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tao = "=0.35.3"
wry = { version = "=0.55.1", default-features = false }
zeroize = "1.8.2"

[build-dependencies]
embed-resource = "=3.0.11"
